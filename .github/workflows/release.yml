name: Mobile release
run-name: ${{ inputs.platform }} release · automatic store submission
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build
        required: true
        type: choice
        default: ios
        options: [ios, android, all]
      android_track:
        description: Google Play destination for Android auto-submission
        type: choice
        default: internal
        options: [internal, production]
permissions:
  contents: read
concurrency:
  group: mobile-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      platforms: ${{ steps.matrix.outputs.platforms }}
    steps:
      - name: Select platforms
        id: matrix
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          case "$PLATFORM" in
            ios) echo 'platforms=["ios"]' >> "$GITHUB_OUTPUT" ;;
            android) echo 'platforms=["android"]' >> "$GITHUB_OUTPUT" ;;
            all) echo 'platforms=["ios","android"]' >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
  release:
    name: ${{ matrix.platform }} release
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(needs.prepare.outputs.platforms) }}
    env:
      CI: "1"
      APP_ENV: production
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PROJECT_ID: ${{ vars.EXPO_PROJECT_ID }}
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_PRIVACY_URL: ${{ vars.EXPO_PUBLIC_PRIVACY_URL }}
      EXPO_PUBLIC_SUPPORT_URL: ${{ vars.EXPO_PUBLIC_SUPPORT_URL }}
      RELEASE_PLATFORM: ${{ matrix.platform }}
      RELEASE_SUBMIT: "true"
      RELEASE_ANDROID_TRACK: ${{ inputs.android_track }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate and prepare release configuration
        run: node scripts/ci-release.cjs prepare
      - name: Check types
        run: npm run typecheck
      - name: Check local version consistency
        run: npm run version:check
      - name: Check production JavaScript bundle
        run: npx --no-install expo export --platform "$RELEASE_PLATFORM" --output-dir "$RUNNER_TEMP/export"
      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: 27.11.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Check Android Play submission key assignment
        if: matrix.platform == 'android'
        run: node scripts/ci-release.cjs credentials
      - name: Build signed app on EAS
        run: |
          args=(build --platform "$RELEASE_PLATFORM" --profile production --auto-submit-with-profile production --non-interactive --wait --json)
          eas "${args[@]}" > "$RUNNER_TEMP/build.json"
      - name: Identify the exact build from EAS output
        id: reference
        env:
          BUILD_RESULT_PATH: ${{ runner.temp }}/build.json
        run: node scripts/ci-release.cjs reference
      - name: Refresh the exact build status
        env:
          BUILD_ID: ${{ steps.reference.outputs.id }}
        run: eas build:view "$BUILD_ID" --json > "$RUNNER_TEMP/build-verified.json"
      - name: Record exact successful build
        id: build
        env:
          BUILD_RESULT_PATH: ${{ runner.temp }}/build-verified.json
          EXPECTED_BUILD_ID: ${{ steps.reference.outputs.id }}
        run: node scripts/ci-release.cjs result
